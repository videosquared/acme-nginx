user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
    worker_connections  8192;   # each proxied request uses 2 (client + upstream)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens                   off;
    sendfile                        on;
    tcp_nopush                      on;
    tcp_nodelay                     on;
    keepalive_timeout               90s;
    types_hash_max_size             2048;
    server_names_hash_bucket_size   128;

    # Safe default; raise per server block where large uploads are expected
    client_max_body_size            10m;

    # ---- TLS defaults (Mozilla "intermediate") ----
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---- Proxy defaults (override per location as needed) ----
    proxy_http_version      1.1;
    proxy_connect_timeout   10s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;

    # ---- Compression (disable per server for binary/object passthrough) ----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # WebSocket-aware Connection header: "upgrade" for WS, empty otherwise
    # (empty lets upstream keepalive work)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time ua=$upstream_addr';

    access_log  /dev/stdout  main;

    server {
        listen 8080;
        listen [::]:8080;
        location = /nginx-healthz {
            access_log off;
            stub_status;
        }
    }

    # HTTP -> HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Unknown SNI / direct-IP connections on 443: reject the handshake
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/http.conf;
}

stream {
    include /etc/nginx/conf.d/stream.conf;
}